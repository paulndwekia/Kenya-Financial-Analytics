name: React workspace acceptance

on:
  push:
    branches:
      - vercel-react-migration
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: kfa-react-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test all modules and navigation
        run: npm run test:e2e

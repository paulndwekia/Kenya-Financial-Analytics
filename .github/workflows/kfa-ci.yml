name: Kenya Financial Analytics CI

on:
  push:
    branches:
      - vercel-react-migration
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python API syntax
        run: python -m py_compile api/market.py api/refresh.py api/report.py

      - name: Test formatted financial report workbook
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm install

      - name: Test module navigation and finance calculations
        run: npm test

      - name: Type-check the web application
        run: npm run lint
